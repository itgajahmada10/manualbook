<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Result</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header-box { margin-bottom: 20px; border-bottom: 2px solid #2c3e50; padding-bottom: 15px; }
        .header-box h2 { margin: 0; color: #2c3e50; font-size: 22px; text-transform: uppercase; }
        .header-box p { margin: 5px 0 0; color: #7f8c8d; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th { background-color: #2c3e50; color: #fff; padding: 12px; text-align: left; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; }
        td { padding: 15px 12px; border-bottom: 1px solid #eee; vertical-align: top; }
        tr:hover { background-color: #fafafa; }
        .badge-mandatory { background: #4a235a; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-bottom: 6px; display: inline-block; }
        .item-name { font-weight: bold; color: #2c3e50; font-size: 14px; margin-bottom: 4px; }
        .item-pn { font-size: 11px; color: #7f8c8d; }
        .trace-box { border: 1px dashed #bdc3c7; border-radius: 6px; padding: 8px; margin-top: 8px; background: #fdfefe; }
        .trace-box div { margin-bottom: 3px; font-size: 11px; }
        .qty-box { text-align: center; }
        .qty-val { font-size: 16px; font-weight: bold; color: #2c3e50; }
        .qty-label { font-size: 10px; color: #7f8c8d; text-transform: uppercase; }
        .logic-card { background: #f8f9f9; border: 1px solid #e5e8e8; border-radius: 6px; padding: 10px; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 10px; }
        .status-reduced { background: #fdedec; color: #c0392b; border: 1px solid #fadbd8; }
        .status-approved { background: #e9f7ef; color: #27ae60; border: 1px solid #d4efdf; }
        .status-under { background: #fef9e7; color: #d4ac0d; border: 1px solid #fcf3cf; }
        .logic-step { font-size: 11px; color: #555; margin-bottom: 4px; }
        .logic-step::before { content: "›"; margin-right: 5px; color: #95a5a6; font-weight: bold; }
        .final-decision { margin-top: 10px; padding-top: 8px; border-top: 1px solid #e5e8e8; font-weight: bold; font-size: 13px; color: #2980b9; }
        .error-msg { background: #f2dede; color: #c0392b; padding: 15px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="result-container">
    <p>Loading data...</p>
</div>

<script>
    // FUNGSI UNTUK MEMBACA PARAMETER URL
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // AMBIL DATA DARI N8N WEBHOOK
    async function fetchData() {
        const jobId = getQueryParam('jobId');
        if (!jobId) {
            document.getElementById('result-container').innerHTML = '<div class="error-msg">Error: Job ID tidak ditemukan.</div>';
            return;
        }

        try {
            const response = await fetch('YOUR_N8N_WEBHOOK_URL_HERE?jobId=' + jobId);
            const data = await response.json();
            renderTable(data);
        } catch (error) {
            document.getElementById('result-container').innerHTML = '<div class="error-msg">Gagal terhubung ke server atau Job ID tidak valid.</div>';
        }
    }

    function getStatusClass(statusText) {
        if (!statusText) return 'status-approved';
        let txt = statusText.toUpperCase();
        if (txt.includes('REDUCED')) return 'status-reduced';
        if (txt.includes('UNDER')) return 'status-under';
        return 'status-approved';
    }

    // RENDER DATA KE HTML
    function renderTable(dataArray) {
        const container = document.getElementById('result-container');
        
        // Cek jika N8N mengembalikan Pesan Error (Sistem Anti-Crash)
        if (dataArray.length > 0 && dataArray[0].PESAN_ERROR) {
            container.innerHTML = `<div class="error-msg">${dataArray[0].PESAN_ERROR}</div>`;
            return;
        }

        if (!dataArray || dataArray.length === 0) {
            container.innerHTML = '<div class="error-msg">Tidak ada data ditemukan untuk Job ID ini.</div>';
            return;
        }

        const headerData = dataArray[0];
        let html = `
            <div class="header-box">
                <h2>&#9875; ${headerData.Nama_Kapal || "UNKNOWN VESSEL"} — ${headerData.Tipe_Mesin || "ENGINE"}</h2>
                <p>Request Date: ${headerData.Tanggal || "-"}</p>
            </div>
            <table>
                <thead>
                    <tr>
                        <th width="5%">NO</th>
                        <th width="30%">IDENTITY & TRACEABILITY</th>
                        <th width="10%">INVENTORY</th>
                        <th width="20%">TARGET RH & HISTORY</th>
                        <th width="30%">DECISION LOGIC</th>
                        <th width="5%">VERIFY</th>
                    </tr>
                </thead>
                <tbody>
        `;

        dataArray.forEach(item => {
            let statusClass = getStatusClass(item.AI_Status);
            let logicLines = item.Rekomendasi_AI ? item.Rekomendasi_AI.split(" | ") : [];
            let logicHtml = "";
            let finalDecisionHtml = "";
            
            logicLines.forEach(line => {
                if(line.includes("FINAL DECISION")) {
                    finalDecisionHtml = `<div class="final-decision">${line}</div>`;
                } else {
                    logicHtml += `<div class="logic-step">${line}</div>`;
                }
            });

            html += `
                <tr>
                    <td>${item.No_Item_PDF || "-"}</td>
                    <td>
                        <div class="badge-mandatory">MANDATORY</div>
                        <div class="item-name">${item.Nama_Barang || "-"}</div>
                        <div class="item-pn">PN: ${item.No_Part || "-"}</div>
                        <div class="trace-box">
                            <div><b>DB:</b> ${item.Nama_Master || "-"}</div>
                            <div><b>RH:</b> <span style="color:#d35400;">${item.Nama_RH || "-"}</span></div>
                            <div style="margin-top:4px;">${item.Warning_Text || ""}</div>
                        </div>
                    </td>
                    <td>
                        <div class="qty-box" style="margin-bottom:10px;">
                            <div class="qty-label">REQ</div>
                            <div class="qty-val">${item.Qty_Diminta || 0}</div>
                        </div>
                        <div class="qty-box">
                            <div class="qty-label">ROB</div>
                            <div class="qty-val">${item.ROB || 0}</div>
                        </div>
                    </td>
                    <td>
                        <div style="font-weight:bold; margin-bottom:5px; color:#c0392b;">${item.Target_Cylinder !== "-" ? item.Target_Cylinder : "SAFE"}</div>
                        ${item.RH_Terakhir || "-"}
                    </td>
                    <td>
                        <div class="status-badge ${statusClass}">${item.AI_Status || "APPROVED"}</div>
                        <div class="logic-card">
                            ${logicHtml}
                            ${finalDecisionHtml}
                        </div>
                    </td>
                    <td style="text-align:center;">
                        <input type="checkbox" style="transform: scale(1.5); cursor:pointer;">
                    </td>
                </tr>
            `;
        });

        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    // Jalankan fungsi
    fetchData();
</script>

</body>
</html>
